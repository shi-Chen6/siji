<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>网络与信息安全管理员·分类刷题</title>
<style>
:root{
  --bg:#f2f4f9; --card:#ffffff; --text:#1a2233; --sub:#7a8699;
  --line:#e8ecf3; --brand:#4f6ef7; --brand2:#7c4dff;
  --ok:#10b981; --okbg:#e7f8f1; --err:#ef4444; --errbg:#fdecec;
  --single:#4f6ef7; --multi:#f59e0b; --judge:#10b981;
  --shadow:0 6px 24px rgba(30,50,90,.08);
}
html[data-theme="dark"]{
  --bg:#0f1523; --card:#1a2233; --text:#e7edf7; --sub:#8b98ad;
  --line:#263147; --brand:#6c8bff; --brand2:#9d7bff;
  --ok:#34d399; --okbg:#123328; --err:#f87171; --errbg:#3a1d24;
  --shadow:0 6px 24px rgba(0,0,0,.4);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);transition:background .25s,color .25s}
#app{max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);box-shadow:0 0 0 1px var(--line);position:relative}
header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;padding:18px 18px 14px;border-radius:0 0 22px 22px}
header .top{display:flex;align-items:center;justify-content:space-between}
header h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.5px}
header .sub{font-size:12px;opacity:.9;margin-top:4px}
.theme-btn{background:rgba(255,255,255,.18);border:none;color:#fff;width:34px;height:34px;border-radius:10px;font-size:16px;cursor:pointer}
main{flex:1;padding:14px 14px 84px;overflow-y:auto}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:30}
nav .nb{flex:1;padding:9px 0 8px;text-align:center;font-size:11px;color:var(--sub);cursor:pointer;transition:.15s}
nav .nb .ic{font-size:20px;display:block;margin-bottom:1px}
nav .nb.on{color:var(--brand);font-weight:600}
/* 分类卡片 */
.sec-title{font-size:14px;font-weight:700;margin:6px 2px 10px;display:flex;align-items:center;gap:6px}
.cat-card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);cursor:pointer;transition:.18s;border:1px solid transparent}
.cat-card:active{transform:scale(.985)}
.cat-head{display:flex;align-items:center;gap:10px}
.cat-badge{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;color:#fff}
.cat-info{flex:1;min-width:0}
.cat-name{font-size:15px;font-weight:700}
.cat-count{font-size:12px;color:var(--sub);margin-top:2px}
.cat-arrow{color:var(--sub);font-size:18px}
.subchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.subchip{background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:7px 12px;font-size:12px;color:var(--text);display:flex;align-items:center;gap:6px}
.subchip b{color:var(--brand);font-weight:700}
/* 做题 */
.qmeta{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.tag{font-size:11px;padding:3px 9px;border-radius:8px;color:#fff;font-weight:600}
.tag.single{background:var(--single)} .tag.multi{background:var(--multi)} .tag.judge{background:var(--judge)}
.progress{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));transition:.2s}
.qcard{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.qnum{font-size:12px;color:var(--sub);margin-bottom:6px}
.qstem{font-size:15.5px;line-height:1.65;font-weight:600;white-space:pre-wrap}
.opt{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1.5px solid var(--line);border-radius:13px;padding:12px 13px;margin-top:10px;cursor:pointer;transition:.15s;font-size:14.5px;line-height:1.55}
.opt .k{width:26px;height:26px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;color:var(--text);border:1px solid var(--line)}
.opt.sel{border-color:var(--brand);background:rgba(79,110,247,.06)}
.opt.sel .k{background:var(--brand);color:#fff;border-color:var(--brand)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.right .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong{border-color:var(--err);background:var(--errbg)}
.opt.wrong .k{background:var(--err);color:#fff;border-color:var(--err)}
.opt.lock{pointer-events:none}
.result-bar{border-radius:13px;padding:12px 14px;margin-top:12px;font-size:13.5px;line-height:1.6}
.result-bar.ok{background:var(--okbg);color:var(--ok)}
.result-bar.no{background:var(--errbg);color:var(--err)}
.result-bar.na{background:var(--bg);color:var(--sub);border:1px dashed var(--line)}
.result-bar b{font-weight:700}
.btn{display:block;width:100%;padding:13px;border:none;border-radius:13px;font-size:15px;font-weight:700;cursor:pointer;margin-top:12px;transition:.15s}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff}
.btn.ghost{background:var(--card);color:var(--brand);border:1.5px solid var(--brand)}
.btn:active{transform:scale(.98)}

.done-card{background:var(--card);border-radius:18px;padding:26px 20px;text-align:center;box-shadow:var(--shadow)}
.done-emoji{font-size:52px}
.done-score{font-size:40px;font-weight:800;background:linear-gradient(135deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;color:transparent;margin:8px 0}
.done-stats{display:flex;justify-content:center;gap:20px;margin:14px 0;font-size:13px;color:var(--sub)}
.done-stats b{color:var(--text);font-size:18px}

.item{background:var(--card);border-radius:13px;padding:12px 13px;margin-bottom:9px;box-shadow:var(--shadow)}
.item .t{font-size:14px;line-height:1.55;margin-bottom:6px}
.item .m{font-size:11.5px;color:var(--sub);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.empty{text-align:center;color:var(--sub);padding:50px 20px;font-size:14px}
.empty .e{font-size:44px;margin-bottom:10px}
.tabs{display:flex;background:var(--card);border-radius:12px;padding:4px;margin-bottom:12px;box-shadow:var(--shadow)}
.tabs .t{flex:1;text-align:center;padding:8px;border-radius:9px;font-size:13px;cursor:pointer;color:var(--sub)}
.tabs .t.on{background:var(--brand);color:#fff;font-weight:600}
.back{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--brand);cursor:pointer;margin-bottom:10px;font-weight:600}
.multi-hint{font-size:12px;color:var(--sub);margin-top:8px}
.source-tag{font-size:10.5px;color:var(--sub);background:var(--bg);padding:2px 7px;border-radius:6px}
</style>
</head>

const CAT_COLOR = ['#4f6ef7','#7c4dff','#0ea5e9','#10b981','#f59e0b','#ef4444','#ec4899','#8b5cf6','#14b8a6','#f97316','#6366f1','#06b6d4','#84cc16','#64748b','#a855f7'];

function $(s){return document.querySelector(s)}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
const store = {
  get(k,d){try{return JSON.parse(localStorage.getItem('wansec_'+k))??d}catch(e){return d}},
  set(k,v){localStorage.setItem('wansec_'+k, JSON.stringify(v))}
};

// 分组
function buildTree(){
  const tree = new Map();
  QUESTIONS.forEach((q,i)=>{ q.id=i;
    if(!tree.has(q.cat)) tree.set(q.cat,new Map());
    const subs=tree.get(q.cat);
    if(!subs.has(q.subcat)) subs.set(q.subcat,[]);
    subs.get(q.subcat).push(q);
  });
  return tree;
}
const TREE = buildTree();

// 状态
let state = {view:'home', cat:null, subcat:null, qlist:[], idx:0, picked:new Set(), answered:false, results:[]};

function render(){
  const main=$('#main');
  if(state.view==='home') renderHome(main);
  else if(state.view==='quiz') renderQuiz(main);
  else if(state.view==='wrong') renderWrong(main);
  else if(state.view==='history') renderHistory(main);
  document.querySelectorAll('nav .nb').forEach(n=>n.classList.toggle('on', n.dataset.view===state.view));
  main.scrollTop=0;
}

function renderHome(main){
  let html='<div class="sec-title">📚 知识点分类 <span style="font-size:11px;color:var(--sub);font-weight:400">共 '+QUESTIONS.length+' 题 · 点击小类开始做题</span></div>';
  let ci=0;
  TREE.forEach((subs,cat)=>{
    let total=0; subs.forEach(l=>total+=l.length);
    const color=CAT_COLOR[ci%CAT_COLOR.length]; ci++;
    html+='<div class="cat-card" data-cat="'+esc(cat)+'">';
    html+='<div class="cat-head"><div class="cat-badge" style="background:'+color+'">'+(CAT_ICON[cat]||'📦')+'</div>';
    html+='<div class="cat-info"><div class="cat-name">'+esc(cat)+'</div><div class="cat-count">'+subs.size+' 个小类 · '+total+' 题</div></div>';
    html+='<div class="cat-arrow">▸</div></div>';
    html+='<div class="subchips">';
    subs.forEach((list,sub)=>{
      html+='<div class="subchip" data-sub="'+esc(sub)+'" data-cat="'+esc(cat)+'">'+esc(sub)+' <b>'+list.length+'</b></div>';
    });
    html+='</div></div>';
  });
  main.innerHTML=html;
  main.querySelectorAll('.subchip').forEach(el=>{
    el.addEventListener('click',e=>{
      e.stopPropagation();
      startQuiz(el.dataset.cat, el.dataset.sub);
    });
  });
}

function startQuiz(cat,sub){
  const list=TREE.get(cat).get(sub);
  state={view:'quiz',cat,subcat:sub,qlist:list,idx:0,picked:new Set(),answered:false,results:[],logged:false};
  render();
}

function renderQuiz(main){
  const total=state.qlist.length;
  if(state.idx>=total){ renderDone(main); return; }
  const q=state.qlist[state.idx];
  const isMulti=q.type==='多选';
  const done=state.results.length;
  const pct=(state.idx/total*100);
  let html='<div class="back" id="backBtn">‹ 返回分类</div>';
  html+='<div class="qmeta"><span class="tag '+(q.type==='单选'?'single':q.type==='多选'?'multi':'judge')+'">'+TYPE_LABEL[q.type]+'</span>';
  html+='<div class="progress"><i style="width:'+pct+'%"></i></div><span style="font-size:12px;color:var(--sub)">'+(state.idx+1)+'/'+total+'</span></div>';
  html+='<div class="qcard"><div class="qnum">第 '+(state.idx+1)+' 题 <span class="source-tag">'+esc(q.source)+'</span></div>';
  html+='<div class="qstem">'+esc(q.stem)+'</div>';
  if(isMulti) html+='<div class="multi-hint">⚠️ 多选题：点击多个选项后，点「确认答案」</div>';
  q.options.forEach(o=>{
    const k=o.k;
    let cls='opt';
    if(state.picked.has(k)) cls+=' sel';
    if(state.answered){
      cls+=' lock';
      const rightAns=(q.answer||'').split('');
      if(rightAns.includes(k)) cls+=' right';
      else if(state.picked.has(k)) cls+=' wrong';
    }
    html+='<div class="opt '+cls+'" data-k="'+k+'"><div class="k">'+k+'</div><div>'+esc(o.t)+'</div></div>';
  });
  html+='</div>';
  // 结果区
  if(state.answered){
    if(!q.answer){
      html+='<div class="result-bar na">ℹ️ 本题<b>原题缺答案</b>，已跳过判题。</div>';
    }else{
      const my=[...state.picked].sort().join('');
      const correct=my===q.answer;
      const ansLabel=q.type==='判断'?({'A':'正确','B':'错误'}[q.answer]||q.answer):q.answer;
      if(correct) html+='<div class="result-bar ok">✅ <b>回答正确！</b> 答案：'+ansLabel+'</div>';
      else html+='<div class="result-bar no">❌ <b>回答错误</b> 正确答案：'+ansLabel+'</div>';
    }
    const isLast=state.idx===total-1;
    html+='<button class="btn primary" id="nextBtn">'+(isLast?'查看成绩':'下一题 →')+'</button>';
  }else{
    if(isMulti){
      html+='<button class="btn primary" id="confirmBtn">确认答案</button>';
    }
  }
  main.innerHTML=html;

  $('#backBtn')?.addEventListener('click',()=>{state.view='home';render()});
  if(!state.answered){
    main.querySelectorAll('.opt').forEach(el=>{
      el.addEventListener('click',()=>{
        const k=el.dataset.k;
        if(isMulti){
          if(state.picked.has(k)) state.picked.delete(k); else state.picked.add(k);
          render();
        }else{
          state.picked=new Set([k]);
          judge(q);
        }
      });
    });
    $('#confirmBtn')?.addEventListener('click',()=>judge(q));
  }else{
    $('#nextBtn')?.addEventListener('click',()=>{
      state.idx++; state.picked=new Set(); state.answered=false; render();
    });
  }
}

function judge(q){
  if(q.answer){
    const my=[...state.picked].sort().join('');
    const correct=my===q.answer;
    state.results.push({id:q.id, correct});
    if(correct) markMastered(q.id); else addWrong(q, my);
  }else{
    state.results.push({id:q.id, correct:null});
  }
  state.answered=true;
  render();
}

function markMastered(id){
  const wb=store.get('wrong',[]);
  const idx=wb.findIndex(w=>w.id===id);
  if(idx>=0){ wb[idx].mastered=true; store.set('wrong', wb); }
}

function renderDone(main){
  const total=state.results.length;
  const right=state.results.filter(r=>r.correct===true).length;
  const na=state.results.filter(r=>r.correct===null).length;
  const rate=total-na>0 ? Math.round(right/(total-na)*100) : 0;
  let html='<div class="back" id="backBtn">‹ 返回分类</div>';
  html+='<div class="done-card"><div class="done-emoji">'+(rate>=80?'🎉':rate>=60?'💪':'📖')+'</div>';
  html+='<div class="done-score">'+rate+'%</div>';
  html+='<div style="font-size:13px;color:var(--sub)">'+esc(state.cat)+' · '+esc(state.subcat)+'</div>';
  html+='<div class="done-stats"><div>总题数<b>'+total+'</b></div><div>答对<b style="color:var(--ok)">'+right+'</b></div><div>答错<b style="color:var(--err)">'+(total-na-right)+'</b></div>'+(na?'<div>缺答案<b>'+na+'</b></div>':'')+'</div>';
  html+='<button class="btn primary" id="againBtn">🔄 再练一次</button>';
  html+='<button class="btn ghost" id="homeBtn">📚 返回分类</button></div>';
  main.innerHTML=html;
  if(!state.logged){ addHistory({time:Date.now(), cat:state.cat, subcat:state.subcat, total, right, na}); state.logged=true; }
  $('#againBtn').addEventListener('click',()=>startQuiz(state.cat, state.subcat));
  $('#homeBtn').addEventListener('click',()=>{state.view='home';render()});
  $('#backBtn').addEventListener('click',()=>{state.view='home';render()});
}

// 错题本
function addWrong(q, my){
  const wb=store.get('wrong',[]);
  const idx=wb.findIndex(w=>w.id===q.id);
  if(idx>=0){ wb[idx].times=(wb[idx].times||1)+1; }
  else{ wb.push({id:q.id, times:1, mastered:false}); }
  store.set('wrong', wb);
}
function renderWrong(main){
  const wb=store.get('wrong',[]);
  const tab=store.get('wrongTab','all');
  let html='<div class="tabs"><div class="t '+(tab==='all'?'on':'')+'" id="tabAll">全部错题</div><div class="t '+(tab==='todo'?'on':'')+'" id="tabTodo">待攻克</div></div>';
  let list=wb;
  if(tab==='todo') list=wb.filter(w=>!w.mastered);
  if(list.length===0){ html+='<div class="empty"><div class="e">📭</div>暂无错题，继续加油！</div>'; main.innerHTML=html; bindWrongTab(); return; }
  html+='<button class="btn primary" id="practiceBtn" style="margin:0 0 12px">📝 练习'+(tab==='all'?'全部错题':'待攻克')+'（'+list.length+' 题）</button>';
  // 按分类分组显示
  list.forEach(w=>{
    const q=QUESTIONS[w.id]; if(!q) return;
    const ansLabel=q.answer ? (q.type==='判断'?({'A':'正确','B':'错误'}[q.answer]||q.answer):q.answer) : '缺答案';
    html+='<div class="item"><div class="t">'+esc(q.stem)+'</div>';
    html+='<div class="m"><span class="tag '+(q.type==='单选'?'single':q.type==='多选'?'multi':'judge')+'">'+TYPE_LABEL[q.type]+'</span>';
    html+='<span>'+esc(q.cat)+'</span><span>答案：<b>'+ansLabel+'</b></span><span>错'+w.times+'次</span><span class="source-tag">'+esc(q.source)+'</span></div></div>';
  });
  main.innerHTML=html;
  bindWrongTab();
  $('#practiceBtn').addEventListener('click',()=>startWrongQuiz(tab));
}

function startWrongQuiz(tab){
  const wb=store.get('wrong',[]);
  const list=(tab==='todo'?wb.filter(w=>!w.mastered):wb).map(w=>QUESTIONS[w.id]).filter(Boolean);
  if(list.length===0){ alert('暂无错题'); return; }
  state={view:'quiz',cat:'错题练习',subcat:(tab==='todo'?'待攻克':'全部错题'),qlist:list,idx:0,picked:new Set(),answered:false,results:[],logged:false};
  render();
}
function bindWrongTab(){
  $('#tabAll')?.addEventListener('click',()=>{store.set('wrongTab','all');render()});
  $('#tabTodo')?.addEventListener('click',()=>{store.set('wrongTab','todo');render()});
}

// 历史
function renderHistory(main){
  const hs=store.get('history',[]);
  let html='<div class="sec-title">📊 练习历史</div>';
  if(hs.length===0){ html+='<div class="empty"><div class="e">🗓️</div>暂无练习记录</div>'; main.innerHTML=html; return; }
  hs.slice().reverse().forEach(h=>{
    const d=new Date(h.time);
    const dt=(d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    html+='<div class="item"><div class="t">'+esc(h.cat)+' · '+esc(h.subcat)+'</div>';
    html+='<div class="m"><span>'+dt+'</span><span>'+h.total+'题</span><span style="color:var(--ok)">对'+h.right+'</span><span style="color:var(--err)">错'+(h.total-h.right-h.na)+'</span></div></div>';
  });
  main.innerHTML=html;
}

// 主题
function applyTheme(){
  const t=store.get('theme','light');
  document.documentElement.dataset.theme=t;
  $('#themeBtn').textContent=t==='dark'?'☀️':'🌙';
}
$('#themeBtn').addEventListener('click',()=>{
  const t=document.documentElement.dataset.theme==='dark'?'light':'dark';
  store.set('theme',t); applyTheme();
});
document.querySelectorAll('nav .nb').forEach(n=>n.addEventListener('click',()=>{
  state.view=n.dataset.view;
  if(state.view!=='quiz') render();
}));
applyTheme();
render();
</script>
</body>
</html>
